version: '3.8'

services:
  # 1. Next.js Standalone Application
  web:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prepmeup}:${POSTGRES_PASSWORD:-prepmeup_secure_pass}@postgres:5432/${POSTGRES_DB:-prepmeup}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - NEXT_PUBLIC_PMU_SUPABASE_URL=${NEXT_PUBLIC_PMU_SUPABASE_URL}
      - NEXT_PUBLIC_PMU_SUPABASE_ANON_KEY=${NEXT_PUBLIC_PMU_SUPABASE_ANON_KEY}
      - PMU_SUPABASE_SERVICE_ROLE_KEY=${PMU_SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
    depends_on:
      - postgres
      - redis
    networks:
      - prepmeup-network

  # 2. Dedicated PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prepmeup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prepmeup_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-prepmeup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/prepmeup:/docker-entrypoint-initdb.d:ro
    networks:
      - prepmeup-network

  # 3. Redis In-Memory Cache for Session & Rate Limiting
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - prepmeup-network

  # 4. NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - prepmeup-network

  # 5. Cloudflare Tunnel (Zero-Trust Secure Expose without Port Forwarding)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - prepmeup-network

volumes:
  postgres_data:
  redis_data:

networks:
  prepmeup-network:
    driver: bridge
