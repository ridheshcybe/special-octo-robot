# PrepMeUp AI - Hybrid Strategy (A + C) Edge Reverse Proxy Configuration
# Runs on GCP Edge VM / Container to bridge Cloud Edge with Self-Hosted Home Server

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;

    # Logging format with upstream timing and status
    log_format hybrid_log '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" upstream: $upstream_addr '
                         'upstream_status: $upstream_status '
                         'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log hybrid_log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Rate Limiting Zones (DDoS and abuse defense at GCP Edge)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Microcaching & Edge Caching Zones
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC_CACHE:30m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=API_MICROCACHE:10m max_size=200m inactive=1m use_temp_path=off;

    # Upstream Definition: Primary = Self-Hosted Home Server via WireGuard/Tunnel
    # Backup = Local GCP Fallback Service (serves offline status + cached Atlas/Simulations)
    upstream hybrid_backend {
        # Primary: Tunnel IP / domain of your Self-Hosted Home Server (Port 3001)
        server 10.8.0.2:3001 max_fails=3 fail_timeout=15s;

        # Backup: Local GCP offline fallback server (spins up if Home Server drops)
        server 127.0.0.1:8088 backup;

        keepalive 32;
    }

    # Upstream Definition for Directus Headless CMS on Home Server
    upstream directus_backend {
        server 10.8.0.2:8055 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # Internal Offline Fallback Server (Runs locally inside GCP edge)
    server {
        listen 127.0.0.1:8088;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files /fallback.html =503;
            add_header Retry-After 60 always;
            add_header X-PrepMeUp-Status "Hybrid-Edge-Fallback-Mode" always;
        }

        # Keep Atlas accessible even during home server maintenance
        location /atlas.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Main Public Virtual Host (Terminated via Cloudflare / GCP SSL)
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Enable connection limiting
        limit_conn addr_limit 50;

        # Custom Error Pages when all upstreams fail
        error_page 502 503 504 /fallback.html;
        location = /fallback.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ----------------------------------------------------------------------
        # 1. Razorpay Webhooks (Mission Critical: NEVER buffer, direct pass-through)
        # ----------------------------------------------------------------------
        location /api/prepmeup/payments/webhook {
            proxy_pass http://hybrid_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Direct body streaming without buffering
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # ----------------------------------------------------------------------
        # 2. Next.js Static Assets & Visual Atlas (Edge Cached at GCP)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://hybrid_backend;
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 304 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /atlas.html {
            proxy_pass http://hybrid_backend;
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 12h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=43200";
        }

        # ----------------------------------------------------------------------
        # 3. Directus CMS Admin & Media Assets (Home Server Storage)
        # ----------------------------------------------------------------------
        location /cms/ {
            rewrite ^/cms/(.*) /$1 break;
            proxy_pass http://directus_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 4. API Routes (Rate limited, microcached where applicable)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hybrid_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover triggers for API calls
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 4s;
            proxy_read_timeout 25s;
        }

        # ----------------------------------------------------------------------
        # 5. General Application Routes (Failover Enabled)
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=40 nodelay;

            proxy_pass http://hybrid_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover: if home server is unreachable, serve backup immediately
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
